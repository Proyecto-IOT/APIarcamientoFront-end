<div class="row vh-100 g-0">
    <div class="col-lg-6 position-relative d-none d-lg-block">
        <div class="bg-holder"></div>
    </div>
    <div class="col-lg-6">
        <div class="row align-items-center justify-content-center h-100 g-0 px-4 px-sm-0">
            <div class="col col-sm-6 col-lg-7 col-xl-6">
               <p class="d-flex justify-content-center mb-3 logo"><span class="logoSd">API</span>arcamiento</p>
               <div class="text-center mb-4">
                <h3 class="fw-bold">Log In</h3>
                <p class="text-secondary">Accede a tu cuenta</p>
                <div class="position-relative">
                    <hr class="text-secondary">
                   </div>
               </div>

               <form [formGroup]="loginForm">
                <div class="input-group mt-3">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input formControlName="email" type="email" class="form-control form-control-lg fs-6" placeholder="Email">
                </div>
                <span class="error-label" *ngIf="loginForm.controls['email'].invalid && isformSubmitted && loginForm.controls['email'].errors?.['required']">No puede estar vacío</span>
                <span class="error-label" *ngIf="loginForm.controls['email'].invalid && isformSubmitted && loginForm.controls['email'].errors?.['email']">Ingrese un correo electronico valido</span>
                <span class="error-label" *ngIf="loginForm.controls['email'].invalid && isformSubmitted && loginForm.controls['email'].errors?.['pattern']">Ingrese un correo electronico valido</span>
                <div class="input-group mt-3">
                    <span class="input-group-text">
                        <i class="bi bi-key"></i>
                    </span>
                    <input formControlName="password" type="password" class="form-control form-control-lg fs-6" placeholder="Password">
                </div>
                <span class="error-label" *ngIf="loginForm.controls['password'].invalid && isformSubmitted && loginForm.controls['password'].errors?.['required']">No puede ir vacío</span>
                <span class="error-label" *ngIf="loginForm.controls['password'].invalid && isformSubmitted && loginForm.controls['password'].errors?.['minlength']">Tiene que tener mínimo 3 caracteres</span>
                <span class="error-label" *ngIf="loginForm.controls['password'].invalid && isformSubmitted && loginForm.controls['password'].errors?.['maxlength']">Solo se permiten 20 caracteres</span>
                <button class="mt-3 btn btn-lg w-100 btnLR mb-3" type="button" (click)="onSubmit()">Iniciar sesión</button>
                <small class="d-flex justify-content-center text-secondary gap-2">No tienes cuenta? <a routerLink="/sign-Up">Registrate aquí</a></small>
               </form>
            </div>
        </div>
    </div>
</div>
