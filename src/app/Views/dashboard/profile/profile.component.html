<div class="card-container">
  <div class="col-md-6 mb-3">
    <span class="badge text-bg text-wrap"><i class="bi bi-info-circle"></i> En este apartado puedes ver tu información</span>
  </div>
  <h3 class="main-title">{{msg()}}</h3>
  <div class="card-wrapper">
    <div class="container">
      <div class="row">
        <div class="col-lg-4">
          <div class="card bgCard mb-4">
            <div class="card-body text-center">
              <img src="../../../../assets/{{profilePhoto()}}.jpg" alt="ProfilePhoto" alt="avatar"
                class="rounded-circle img-fluid" style="width: 139px;">
              <h5 class="my-3 nombre">{{userInfo.name}}</h5>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card mb-4">
            <div class="card-body">
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0 infoLabel">Apellido Paterno</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{userInfo.last_name}}</p>
                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0 infoLabel">Apellido Materno</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{userInfo.mother_surname}}</p>
                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0 infoLabel">Genero</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{profilePhoto()}}</p>
                </div>
              </div>
              <hr>
              <div class="row">
                <div class="col-sm-3">
                  <p class="mb-0 infoLabel">Email</p>
                </div>
                <div class="col-sm-9">
                  <p class="text-muted mb-0">{{userInfo.email}}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
