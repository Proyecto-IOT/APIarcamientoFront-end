<div class="card-container mb-4">
  <div class="card-wrapper">
    <span class="fw-bold">Filtrar por:</span>
    <!-- FILTROS -->
    <div class="container-fluid mt-4 mb-2 d-flex align-items-center">
      <select name="sensores" id="sensores" class="form-select form-control me-2" [(ngModel)]="properties" multiple>
        <option value="todos">Todos los sensores</option>
        <option value="Ultrasonico">Ultrasonico</option>
        <option value="Sonido">Sonido</option>
        <option value="Humo">Humo</option>
        <option value="Fotoresistencia">Fotoresistencia</option>
        <option value="RFID">RFID</option>
        <option value="Infrarrojo">Infrarrojo</option>
      </select>
      <input type="date" class="form-control mx-2" [(ngModel)]="filterProperty">
    </div>  
    <!-- TABLA --> 
    <table class="table table-hover table-responsive">
      <thead>
        <tr>
          <th>Nombre del sensor</th>
          <th>Clave</th>
          <th>Dato</th>
          <th>Unidad</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let sensor of listAllSensores">
          <ng-container *ngFor="let s of sensor.Sensor">
            <tr *ngFor="let dato of s.Data">
              <ng-container *ngIf="filterSensor(sensor.Nombre) && filterDate(dato.Fecha)">
              <td>{{ sensor.Nombre }} - {{ s.NoSerie }}</td>
              <td>{{ sensor.Clave }}</td>
              <td>{{ dato.Dato }}</td>
              <td>{{ sensor.Unidad }}</td>
              <td>{{ dato.Fecha }}</td>
            </ng-container>
            </tr>
          </ng-container>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
